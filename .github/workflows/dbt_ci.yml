name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb dbt-duckdb pandas faker streamlit pytest pyyaml numpy

      - name: Run End-to-End Test Pipeline
        run: |
          python scripts/run_pipeline.py --scenario model_degradation --seed 42