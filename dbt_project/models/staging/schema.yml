version: 2

models:
  - name: stg_clinical_scans
    description: "Cleansed and typed staging layer for raw DICOM AI triage logs."
    columns:
      - name: event_id
        description: "Primary key for each scan event."
        data_tests:
          - unique
          - not_null
      - name: clinical_priority
        description: "Standardized priority level."
        data_tests:
          - accepted_values:
              values: ['EMERGENCY', 'URGENT', 'ROUTINE']

  - name: int_clinical_turnaround
    description: "Intermediate model containing turnaround calculations and full ML confusion matrix classifications."
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: ai_classification
        description: "ML confusion matrix outcome."
        data_tests:
          - accepted_values:
              values: ['TRUE_POSITIVE', 'FALSE_POSITIVE', 'TRUE_NEGATIVE', 'FALSE_NEGATIVE', 'PENDING_REVIEW']

  - name: fct_clinical_impact
    description: "Aggregated mart containing hospital site KPIs, ML evaluation metrics (Precision, Recall, F1, FNR), and percentile turnaround times."
    columns:
      - name: total_scans
        data_tests:
          - not_null